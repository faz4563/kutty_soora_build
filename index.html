<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/" />

    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta -->
    <title>Kuttysoora Seafoods | Fresh Fish & Seafood Delivery in Chennai</title>
    <meta
      name="description"
      content="Kuttysoora Seafoods offers fresh fish and seafood delivered to your doorstep in Chennai. Quality seafood, hygienic handling, and fast delivery."
    />
    <meta
      name="keywords"
      content="Kuttysoora Seafoods, fresh seafood Chennai, fish delivery Royapuram, seafood wholesaler Chennai"
    />
    <meta name="author" content="Kuttysoora Seafoods" />

    <!-- Open Graph (Google + Social) -->
    <meta property="og:title" content="Kuttysoora Seafoods" />
    <meta
      property="og:description"
      content="Fresh fish and seafood delivered to your door in Chennai."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.kuttysoora.com" />
    <meta property="og:image" content="icons/Icon-512.png" />

    <!-- iOS / PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Kuttysoora Seafoods" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- Razorpay -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Structured Data (IMPORTANT for Google) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Kuttysoora Seafoods",
        "url": "https://www.kuttysoora.com",
        "logo": "https://www.kuttysoora.com/icons/Icon-192.png",
        "description": "Fresh fish and seafood delivered to your doorstep in Chennai.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Royapuram",
          "addressRegion": "Tamil Nadu",
          "postalCode": "600013",
          "addressCountry": "IN"
        },
        "telephone": "+91-9962463925"
      }
    </script>

    <!-- Loading Screen Styles -->
    <style>
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #e3f2fd 0%, #f8fffe 100%);
        min-height: 100vh;
        font-family: "Roboto", sans-serif;
      }

      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .loading-logo {
        width: 120px;
        height: 120px;
        margin-bottom: 24px;
      }

      .loading-title {
        font-size: 26px;
        font-weight: bold;
        color: #0d47a1;
        margin-bottom: 12px;
      }

      .loading-subtitle {
        font-size: 16px;
        color: #555;
        margin-bottom: 32px;
      }

      .loading-spinner {
        border: 4px solid #e3f2fd;
        border-top: 4px solid #0d47a1;
        border-radius: 50%;
        width: 48px;
        height: 48px;
        animation: spin 1.2s linear infinite;
        margin-bottom: 12px;
      }

      .loading-status {
        font-size: 14px;
        color: #777;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <!-- SEO Friendly Visible Content -->
    <h1 style="display:none;">Kuttysoora Seafoods</h1>

    <!-- Loading Screen -->
    <div id="loading">
      <div class="loading-logo">
        <img
          src="icons/Icon-192.png"
          alt="Kuttysoora Seafoods Logo"
          width="120"
          height="120"
        />
      </div>

      <div class="loading-title">Kuttysoora Seafoods</div>
      <div class="loading-subtitle">
        Fresh fish & seafood delivered to your door
      </div>

      <div class="loading-spinner"></div>
      <div class="loading-status">Loading...</div>
    </div>

    <!-- Flutter Bootstrap -->
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
