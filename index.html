<!DOCTYPE html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="/" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="kuttysoora_seafood" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Kuttysoora Seafood</title>
    <link rel="manifest" href="manifest.json" />
    
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    
    <style>
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #e3f2fd 0%, #f8fffe 100%);
        min-height: 100vh;
      }
      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: "Roboto", sans-serif;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .loading-logo {
        width: 120px;
        height: 120px;
        margin-bottom: 24px;
        color: #0d47a1;
      }
      .loading-logo svg {
        width: 100%;
        height: 100%;
      }
      .loading-title {
        font-size: 24px;
        font-weight: bold;
        color: #0d47a1;
        margin-bottom: 16px;
      }
      .loading-subtitle {
        font-size: 16px;
        color: #757575;
        margin-bottom: 48px;
      }
      .loading-spinner {
        border: 4px solid #e3f2fd;
        border-top: 4px solid #0d47a1;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1.5s linear infinite;
        margin: 0 auto 16px;
        box-shadow: 0 4px 8px rgba(13, 71, 161, 0.2);
      }
      .loading-status {
        font-size: 14px;
        color: #757575;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <!-- App Logo/Icon -->
      <div class="loading-logo">
        <!-- <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/>
        </svg> -->
        <img src="icons/Icon-192.png" alt="App Logo" style="width: 100%; height: 100%;" />
      </div>
      
      <!-- Title -->
      <div class="loading-title">Kuttysoora Seafood</div>
      
      <!-- Subtitle -->
      <div class="loading-subtitle">Fresh seafood delivered to your door</div>
      
      <!-- Loading Spinner -->
      <div class="loading-spinner"></div>
      
      <!-- Status Text -->
      <div class="loading-status">Loading...</div>
    </div>

    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
